<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fashionphile JSON-LD</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Product",
    "name": "Chanel Classic Wallet Black Caviar",
    "url": "https://www.fashionphile.com/p/chanel-classic-wallet-black-caviar-jsonld",
    "brand": {"@type": "Brand", "name": "Chanel"},
    "itemCondition": "UsedCondition",
    "offers": {
      "@type": "Offer",
      "price": "710.00",
      "priceCurrency": "USD"
    }
  }
  </script>
</head>
<body></body>
</html>
